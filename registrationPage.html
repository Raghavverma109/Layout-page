<!DOCTYPE html>
<html>
<head>
  <title>Event Registration</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; }
    form { max-width: 500px; margin: auto; display: grid; gap: 15px; }
    input, select, button {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<h2>Event Registration Form</h2>

<form id="registration-form">
  <input type="text" name="name" placeholder="Full Name" required>
  <input type="email" name="email" placeholder="Email" required>
  <input type="tel" name="contact" placeholder="Contact Number" required>
  <input type="text" name="college" placeholder="College" required>
  <input type="text" name="branch" placeholder="Branch" required>
  <select name="year" required>
    <option value="">Select Year</option>
    <option value="1st Year">1st Year</option>
    <option value="2nd Year">2nd Year</option>
    <option value="3rd Year">3rd Year</option>
    <option value="4th Year">4th Year</option>
  </select>
  <button type="submit">Register</button>
</form>

<p id="response"></p>

<script>
  document.getElementById("registration-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const form = e.target;
    const data = new FormData(form);

    fetch("https://script.google.com/macros/s/AKfycbyvoMqRHCVbhh0tSYIfM6gR7SWfGK8r827CyrjQjFT338bocObQfqkkd4e7WM-tFZnN/exec", {
      method: "POST",
      body: data
    })
    .then(res => res.text())
    .then(txt => {
      document.getElementById("response").innerText = "Registration successful!";
      form.reset();
    })
    .catch(err => {
      document.getElementById("response").innerText = "Error occurred!";
      console.error(err);
    });
  });
</script>

</body>
</html>
